[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pnicer"
version = "2.0.0.dev0"
description = "Extinction estimation and mapping from photometric catalogs (PNICER, NICER)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    { name = "Stefan Meingast", email = "stefan.meingast@gmail.com" },
]
keywords = ["astronomy", "extinction", "interstellar-medium", "photometry"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=5.3",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/smeingast/PNICER"
Legacy = "https://github.com/smeingast/PNICER/releases/tag/v1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pnicer.data" = ["*.fits"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
