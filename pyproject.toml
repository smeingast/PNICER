[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PNICER"
version = "0.3"
description = "Python package to calculate color-excesses and extinction from arbitrary photometric measurements."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Stefan Meingast", email = "stefan.meingast@gmail.com" },
]
dependencies = [
    "numpy>=1.26.2",
    "scipy>=1.11.4",
    "scikit-learn>=1.3.2",
    "matplotlib>=3.8.2",
    "astropy>=6.0.0",
    "joblib>=1.3.2",
]

[project.urls]
Homepage = "https://github.com/smeingast/PNICER"

[tool.setuptools.packages.find]
include = ["pnicer*"]

[tool.setuptools.package-data]
pnicer = ["tests_resources/*.fits"]
